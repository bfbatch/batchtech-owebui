# BATCHTECH: pushing a tag like v1.0.1 publishes a GitHub release. The tag must match backend/open_webui/BATCHTECH_VERSION.
# Nothing is deployed automatically.
name: BatchTechUI release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches the version file
        run: |
          file_version=$(tr -d '[:space:]' < backend/open_webui/BATCHTECH_VERSION)
          if [ "v$file_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match BATCHTECH_VERSION v$file_version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "BatchTechUI $GITHUB_REF_NAME" \
            --notes "Based on Open WebUI v$upstream." 
